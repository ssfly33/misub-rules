# MiSub 订阅模板：节点（proxies）由 MiSub 自动注入；策略组与规则集托管在本仓库
# 规则按原配置的 25 个连续策略段切分，匹配顺序与原文件完全一致
mixed-port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false
dns:
  enabled: true
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 8.8.4.4
    - tls://1.0.0.1:853
    - tls://dns.google:853

proxy-groups:
- name: 🔰 节点选择
  type: select
  proxies:
    - ♻️ 自动选择
    - 🎯 全球直连
  include-all: true
  exclude-filter: (?i)(剩余流量|套餐到期|距离下次重置|官网|过期)
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
    - 🎯 全球直连
  include-all: true
  exclude-filter: (?i)(剩余流量|套餐到期|距离下次重置|官网|过期)
